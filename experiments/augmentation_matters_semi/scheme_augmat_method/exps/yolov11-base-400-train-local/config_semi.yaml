dataset:
  type: yolo_semi
  train:
    data_root: ./data/banana_data/train
    data_list: ./data/banana_data/train/labeled/list.txt
    batch_size: 2
    flip: True
    rand_resize: [0.5, 1.5]
    resize_base_size: 1024
    crop:
      type: rand
      size: [1024, 1024]
    strong_aug:
      num_augs: 3
      flag_use_random_num_sampling: True
  val:
    data_root: ./data/banana_data/val
    data_list: ./data/banana_data/val/list.txt
    batch_size: 2
    resize_base_size: 1024
  n_sup: 74
  workers: 4
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  ignore_label: 255

trainer:
  epochs: 100
  sup_only_epoch: 10  # Shorter warmup
  evaluate_student: True
  optimizer:
    type: SGD
    kwargs:
      lr: 0.005
      momentum: 0.9
      weight_decay: 0.0005
  lr_scheduler:
    mode: poly
    kwargs:
      power: 0.9
  unsupervised:
    threshold: 0.25     # Lower threshold to generate more pseudo-labels
    loss_weight: 1.0    # Weight for unsupervised loss
    consistency_weight: 1.0
    consistency_mode: mse   # mse | kl
    consistency_temperature: 1.0
    rampup_epochs: 10
    nms_iou: 0.5
    max_det: 300
    score_weighting: True
    score_power: 1.0
    topk_per_image: 100
    # class_thresholds:
    #   0: 0.25
    #   1: 0.35

saver:
  snapshot_dir: checkpoints
  use_tb: True
  auto_resume: True

net:
  num_classes: 2
  sync_bn: True
  ema_decay: 0.999
  encoder:
    pretrain: /home/nghiamt/Worksspace_2/AugSeg/AugSeg_____/models/YOLOv11-Base-400/best.pt
