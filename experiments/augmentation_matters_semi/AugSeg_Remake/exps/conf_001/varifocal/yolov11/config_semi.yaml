dataset:
  type: yolo_semi
  train:
    data_root: /home/jupyter-iec2021iot13/Vinh/AugSeg_Remake/data/banana_data/train
    data_list: /home/jupyter-iec2021iot13/Vinh/AugSeg_Remake/data/banana_data/train/labeled/list.txt
    batch_size: 4
    flip: True
    rand_resize: [0.5, 2.0]
    resize_base_size: 1024
    crop:
      type: rand
      size: [1024, 1024]
    strong_aug:
      num_augs: 3
      flag_use_random_num_sampling: True
  val:
    data_root: /home/jupyter-iec2021iot13/Vinh/AugSeg_Remake/data/banana_data/val
    data_list: /home/jupyter-iec2021iot13/Vinh/AugSeg_Remake/data/banana_data/val/list.txt
    batch_size: 4
    resize_base_size: 1024
  n_sup: 74
  workers: 2
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  ignore_label: 255

trainer:
  epochs: 50
  sup_only_epoch: 0
  evaluate_student: True
  optimizer:
    type: SGD
    kwargs:
      lr: 0.0001
      momentum: 0.9
      weight_decay: 0.0005
  lr_scheduler:
    mode: poly
    kwargs:
      power: 0.9
  unsupervised:
    threshold: 0.01       # Static
    loss_weight: 1.0
    use_cutmix: True
    nms_iou: 0.5
    max_det: 300

saver:
  snapshot_dir: checkpoint
  use_tb: True
  auto_resume: True

net:
  num_classes: 2
  sync_bn: True
  ema_decay: 0.999
  loss_type: varifocal
  encoder:
    pretrain: /home/jupyter-iec2021iot13/Vinh/AugSeg_Remake/YOLO_SEMI/models/YOLOv11-Base-400/best.pt
